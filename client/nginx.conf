server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA: client-side react-router — every non-asset path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API → backend container. `server` is the compose service name.
  location /api/ {
    proxy_pass http://server:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE (/api/rewrite/stream) + long-running /api/orchestrate (deep mode
    # can chain several model calls): no buffering, generous timeouts.
    proxy_buffering off;
    proxy_cache off;
    proxy_set_header Connection '';
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }
}
