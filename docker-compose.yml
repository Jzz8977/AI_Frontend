# 简历改写门户 — 一键部署。
#   1) cp server/.env.example server/.env  并填 JWT_SECRET / DEEPSEEK_API_KEY 等
#   2) docker compose up -d --build
#   3) 打开 http://localhost:8080
services:
  server:
    build: ./server
    env_file:
      - ./server/.env
    environment:
      # Override so SQLite lands on the named volume (survives restarts).
      DB_PATH: /data/data.db
      PORT: "3001"
    volumes:
      - rr-data:/data
    expose:
      - "3001"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  rr-data:
